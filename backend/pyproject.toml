[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL", "RUF"]
ignore = ["E203", "E501", "B008", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"app/evaluation.py" = ["PLR0912", "PLR0915"]
